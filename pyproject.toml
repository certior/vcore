[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcore"
version = "0.2.0"
description = "Runtime, tool-call mapping and Z3 cross-check for vcore, a Lean-verified checker for AI agent policies"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
smt = ["z3-solver>=4.12"]
actions = ["pyyaml>=6"]
dev = ["pytest>=8", "z3-solver>=4.12", "pyyaml>=6"]

[project.scripts]
vcore-actions = "vcore.actions.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
